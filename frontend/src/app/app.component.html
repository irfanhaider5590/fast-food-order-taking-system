<div class="app-container" [class.pos-mode]="isPosMode()">
  @if (isLoggedIn() && licenseWarningMessage && !isPosMode()) {
    <div class="license-warning-banner">
      <div class="container">
        <div class="warning-content">
          <span class="warning-text">{{ licenseWarningMessage }}</span>
          <button class="btn btn-sm btn-outline-light ms-auto" (click)="dismissWarning()">Dismiss</button>
        </div>
      </div>
    </div>
  }

  <header class="app-header" [class.app-header-compact]="isPosMode()">
    <div class="container">
      <div class="header-content">
        <div class="brand-section">
          @if (brandLogoUrl) {
            <img [src]="brandLogoUrl" alt="Brand Logo" class="brand-logo">
          }
          <h1>{{ brandName }}</h1>
        </div>
        <div class="header-actions">
          <button class="btn btn-secondary" (click)="switchLanguage('en')">EN</button>
          <button class="btn btn-secondary" (click)="switchLanguage('ur')">UR</button>
            @if (isLoggedIn()) {
            <button class="btn btn-home" (click)="goHome()">Home</button>
            @if (isAdminUser()) {
              <app-notification-bell></app-notification-bell>
            }
            <button class="btn btn-logout" (click)="logout()">Logout</button>
          }
        </div>
      </div>
    </div>
  </header>

  @if (showBackBar()) {
    <div class="back-bar">
      <div class="container">
        <button type="button" class="btn-back" (click)="goBack()">
          <span aria-hidden="true">←</span> Back
        </button>
      </div>
    </div>
  }

  <main class="app-main" [class.app-main-pos]="isPosMode()">
    <div class="container" [class.container-fluid-pos]="isPosMode()">
      <router-outlet></router-outlet>
    </div>
  </main>

  @if (!isPosMode()) {
    <app-footer></app-footer>
  }
</div>
<app-notification></app-notification>
